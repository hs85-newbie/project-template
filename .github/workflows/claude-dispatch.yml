name: Claude Code (수동 실행)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Claude에게 시킬 작업"
        required: true
        type: string
      max_turns:
        description: "최대 실행 횟수 (기본: 자동 판단)"
        default: ""
        type: string
  repository_dispatch:
    types: [claude-task]

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || 'main' }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: hs85-newbie/my-claude-global
          path: .claude-global
          token: ${{ secrets.GLOBAL_SETTINGS_TOKEN }}
      - run: |
          mkdir -p ~/.claude/skills
          cp .claude-global/CLAUDE.md ~/.claude/CLAUDE.md
          cp -r .claude-global/skills/* ~/.claude/skills/ 2>/dev/null || true
      - name: Bun 설치
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/gstack
          key: gstack-v1-${{ runner.os }}
      - name: gstack 설치 (캐시 미스 시)
        run: |
          if [ ! -f ~/gstack/setup ]; then
            git clone https://github.com/garrytan/gstack.git ~/gstack
          fi
          cd ~/gstack && ./setup --host claude

      # WHY: Claude가 TypeScript 컴파일/린트 실행 시 node_modules가 없으면 실패
      - name: 의존성 설치
        run: npm install

      # WHY: 분석 작업과 코드 수정의 필요 턴 수/모델이 다름 → 작업 유형으로 분기
      - name: 작업 유형 판단
        id: task_type
        env:
          TASK: ${{ inputs.task || github.event.client_payload.task }}
        run: |
          # WHY: TASK를 env로 받아 bash 특수문자(backtick 등) 안전 처리
          TITLE_ONLY=$(echo "$TASK" | sed 's/\. 상세:.*$//')
          DESC_ONLY=$(echo "$TASK" | grep -oP '상세: \K.*' || echo "")

          IS_ANALYSIS=false
          echo "$TITLE_ONLY" | grep -qE "점검|분석|제안|검토" && IS_ANALYSIS=true
          echo "$DESC_ONLY" | grep -qE "원인 분석|계획 수립|보고|점검|분석 후" && IS_ANALYSIS=true

          CATEGORY=$(echo "$TITLE_ONLY" | grep -oP '\[\K[^\]]+' | head -1 || echo "")

          if [ "$IS_ANALYSIS" = true ]; then
            echo "type=analysis" >> $GITHUB_OUTPUT
            echo "max_turns=50" >> $GITHUB_OUTPUT
            echo "model=claude-opus-4-8" >> $GITHUB_OUTPUT
            echo "작업 유형: 분석 (opus, 50턴)"
          elif [ "$CATEGORY" = "정리" ]; then
            echo "type=code" >> $GITHUB_OUTPUT
            echo "max_turns=30" >> $GITHUB_OUTPUT
            echo "model=claude-haiku-4-5" >> $GITHUB_OUTPUT
            echo "작업 유형: 코드 수정 [정리] (haiku, 30턴)"
          else
            echo "type=code" >> $GITHUB_OUTPUT
            echo "max_turns=45" >> $GITHUB_OUTPUT
            echo "model=claude-sonnet-4-6" >> $GITHUB_OUTPUT
            echo "작업 유형: 코드 수정 [${CATEGORY:-일반}] (sonnet, 45턴)"
          fi

      # WHY: task_type에 따라 분석/코드 수정 프롬프트 분기 — 토큰 절약
      - name: 프롬프트 생성
        id: prompt
        env:
          TASK_TYPE: ${{ steps.task_type.outputs.type }}
          USER_TASK: ${{ inputs.task || github.event.client_payload.task }}
          ISSUE_ID: ${{ github.event.client_payload.issue_id || 'manual' }}
        run: |
          if [ "$TASK_TYPE" = "analysis" ]; then
            cat > /tmp/prompt.txt <<'PROMPT_END'
          작업: __TASK__

          작업 ID: __ISSUE_ID__

          프로젝트를 분석하고 결과를 docs/ANALYSIS-__ISSUE_ID__.md 파일로 작성하세요.
          - 파일 구성: 현황 요약, 상세 분석, 마지막에 "후속 작업 목록" 섹션
          - 코드 수정 금지. 분석 파일만 생성.
          - "후속 작업 목록"은 P0/P1/P2 우선순위로 `- [ ] **[카테고리] 제목**` 형식 사용.

          ⚠️ git 명령(checkout, add, commit, push) 금지. 파일 생성만.
          PROMPT_END
          else
            cat > /tmp/prompt.txt <<'PROMPT_END'
          작업: __TASK__

          작업 ID: __ISSUE_ID__

          요구사항의 [카테고리] 제목과 파일/설명만 보고 코드를 수정하세요.
          여러 항목을 한 번에 수정하지 마세요. 1개 항목만 처리.

          ⚠️ git 명령(checkout, add, commit, push) 금지. 파일 수정만.
          PROMPT_END
          fi
          # WHY: sed는 특수문자(backtick/pipe/newline) 치환 시 실패 — python으로 안전 처리
          python3 -c "
          import os
          with open('/tmp/prompt.txt', 'r') as f:
              content = f.read()
          content = content.replace('__TASK__', os.environ['USER_TASK'])
          content = content.replace('__ISSUE_ID__', os.environ['ISSUE_ID'])
          with open('/tmp/prompt.txt', 'w') as f:
              f.write(content)
          "
          {
            echo "prompt<<EOF"
            cat /tmp/prompt.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Claude Code 실행
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: "--max-turns ${{ inputs.max_turns || github.event.client_payload.max_turns || steps.task_type.outputs.max_turns }} --model ${{ steps.task_type.outputs.model }} --dangerously-skip-permissions"

      # WHY: Claude에게 git push를 위임하면 max_turns 초과/권한 문제로 실패 반복
      - name: 변경사항 감지
        id: changes
        run: |
          # WHY: .claude-global은 워크플로우가 별도 checkout한 서브레포 — false positive 방지
          CHANGES=$(git status --porcelain | grep -v '^?? \.claude-global/$' || true)
          if [ -n "$CHANGES" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "변경된 파일:"
            echo "$CHANGES"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "변경사항 없음 (.claude-global 제외)"
          fi

      - name: Git Commit & Push
        id: git_push
        if: steps.changes.outputs.has_changes == 'true'
        env:
          ISSUE_ID: ${{ github.event.client_payload.issue_id || 'manual' }}
          TASK: ${{ inputs.task || github.event.client_payload.task }}
          GH_TOKEN: ${{ secrets.GLOBAL_SETTINGS_TOKEN }}
        run: |
          WORK_BRANCH="claude/${ISSUE_ID}-$(date +%Y%m%d-%H%M%S)"
          echo "work_branch=${WORK_BRANCH}" >> $GITHUB_OUTPUT
          COMMIT_MSG=$(echo "$TASK" | sed 's/\. 상세:.*$//' | head -c 72)

          # WHY: actions/checkout 토큰은 checkout step에서만 유효, push용 별도 설정 필요
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$WORK_BRANCH"

          # WHY: .claude-global은 별도 checkout된 서브레포 — 커밋 대상 제외
          echo ".claude-global" >> .gitignore
          git add -A
          git reset HEAD .gitignore

          if ! git commit -m "${COMMIT_MSG}" 2>&1; then
            echo "push_success=false" >> $GITHUB_OUTPUT
            echo "❌ commit 실패 — 변경사항 없음 추정"
            exit 0
          fi

          # WHY: 네트워크 불안정 대비 재시도 (지수 백오프 2s→4s→8s)
          for i in 1 2 3; do
            if git push origin "$WORK_BRANCH" 2>&1; then
              echo "push_success=true" >> $GITHUB_OUTPUT
              echo "✅ Push 성공 (시도 ${i}/3)"
              exit 0
            fi
            echo "⚠️ Push 실패 (${i}/3), 재시도..."
            sleep $((2 ** i))
          done
          echo "push_success=false" >> $GITHUB_OUTPUT
          echo "❌ Push 3회 실패"
          exit 1

      # WHY: 머지는 사람 확인 게이트 — Claude는 PR 생성까지만 수행 (CLAUDE.md 자율성 경계)
      - name: PR 생성
        if: steps.changes.outputs.has_changes == 'true' && steps.git_push.outputs.push_success == 'true'
        env:
          ISSUE_ID: ${{ github.event.client_payload.issue_id || 'manual' }}
          BRANCH: ${{ github.event.client_payload.branch || 'main' }}
          TASK: ${{ inputs.task || github.event.client_payload.task }}
          WORK_BRANCH: ${{ steps.git_push.outputs.work_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GLOBAL_SETTINGS_TOKEN }}
        run: |
          TITLE=$(echo "$TASK" | sed 's/\. 상세:.*$//' | head -c 72)
          PR_URL=$(gh pr create \
            --base "$BRANCH" \
            --head "$WORK_BRANCH" \
            --title "[${ISSUE_ID}] ${TITLE}" \
            --body "자동 생성 PR — 검토 후 머지해주세요.

          작업: ${TASK}
          🔗 Actions 로그: ${RUN_URL}" 2>&1) || true

          if echo "$PR_URL" | grep -q "github.com"; then
            echo "✅ PR 생성됨: $PR_URL"
          else
            echo "⚠️ PR 생성 실패: $PR_URL"
            echo "브랜치 ${WORK_BRANCH}가 push되었으니 수동으로 PR을 생성하세요."
          fi
